<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindistory Video Generator</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            text-align: center; 
            background: #f5f5f5;
        }
        textarea { 
            width: 90%; 
            padding: 10px; 
            margin: 10px 0; 
            font-size: 16px;
        }
        button { 
            padding: 12px 25px; 
            font-size: 18px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px;
        }
        video { 
            margin-top: 20px; 
            width: 100%; 
            max-width: 480px; 
        }
    </style>
</head>
<body>
    <h1>Hindistory Video Generator 🚀</h1>

    <textarea id="userText" rows="5" placeholder="यहाँ अपनी कहानी लिखें..."></textarea><br>

    <button onclick="generateVideo()">Generate Video</button>

    <div id="videoContainer"></div>

    <script>
        async function generateVideo() {
            const text = document.getElementById('userText').value;

            const response = await fetch('/generate-video', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });

            const data = await response.json();
            const container = document.getElementById('videoContainer');

            if (data.videoUrl) {
                container.innerHTML = `
                    <video controls src="${data.videoUrl}"></video><br>
                    <a href="${data.videoUrl}" download="hindistory.mp4">Download Video</a>
                `;
            } else {
                container.innerHTML = `<p>Error: ${data.error}</p>`;
            }
        }
    </script>
</body>
</html>
